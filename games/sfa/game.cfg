# Street Fighter Alpha: Warriors' Dreams (Capcom 1995, CPS-2 arcade board): per-game settings read by
# the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Street Fighter Alpha
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter Alpha Recomp
id = sfa
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.sfa
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `sfa` is MAME's parent set (Europe 950727); its clones (sfau, sfar1..3, sfaj) are built from it.
rom_set = sfa
rom_parent = sfa
rom_name = Street Fighter Alpha: Warriors' Dreams (Europe 950727)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, four 512 KiB files: 2 MiB). graphics: four files side by
# side per row (64-bit words); the board's gfx region is unpopulated below 0x800000, so the data
# starts there (`@800000`). sound_program: the Z80's ROMs. samples: the QSound chip's.
# key: the board's cipher key.
program = sfze.03d:ebf2054d sfz.04b:8b73b0e5 sfz.05a:0810544d sfz.06:806e8f38
graphics = @800000 sfz.14m:90fefdb3 sfz.16m:5354c948 sfz.18m:41a1e790 sfz.20m:a549df98
sound_program = sfz.01:ffffec7d sfz.02:45f46a08
samples = sfz.11m:c4b093cd sfz.12m:8bdbc4b4
key = sfa.key:7c095631

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 2 MiB (four 512 KiB ROMs), so this spans the whole program.
code_end = 200000
